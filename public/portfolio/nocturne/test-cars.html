<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Car factory test rig</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a0a0c; overflow: hidden; }
  canvas { display: block; }
  #hud { position: fixed; top: 12px; left: 12px; color: #9aa; font: 12px monospace; }
</style>
<script type="importmap">
  { "imports": { "three": "./vendor/three.module.min.js" } }
</script>
</head>
<body>
<div id="hud">car factory test — drag to orbit</div>
<script type="module">
  import * as THREE from 'three';
  import { OrbitControls } from './vendor/OrbitControls.js';
  import { RoomEnvironment } from './vendor/RoomEnvironment.js';
  import { buildCar, CARS } from './js/cars.js';

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.1;
  document.body.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a0a0c);

  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

  const params = new URLSearchParams(location.search);
  const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 100);
  if (params.get('view') === 'profile') camera.position.set(0.001, 1.0, 7.5);
  else camera.position.set(9, 4.5, 12);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 0.8, 0);
  controls.enableDamping = true;
  window.__rig = { camera, controls, scene };

  // floor
  const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(60, 60),
    new THREE.MeshStandardMaterial({ color: 0x111114, metalness: 0.4, roughness: 0.35 })
  );
  floor.rotation.x = -Math.PI / 2;
  scene.add(floor);

  const key = new THREE.DirectionalLight(0xffffff, 2.4);
  key.position.set(5, 8, 4);
  scene.add(key);
  scene.add(new THREE.AmbientLight(0x334, 0.5));

  // one of each car, in a row
  const colors = [0xb8bcc4, 0x7a1420, 0x1a2c48, 0x181a1e];
  const keys = Object.keys(CARS);
  const groups = [];
  keys.forEach((k, i) => {
    const { group } = buildCar(k, colors[i % colors.length]);
    if (params.get('view') === 'profile') {
      group.visible = i === Number(params.get('car') || 0);
    } else {
      group.position.z = (i - (keys.length - 1) / 2) * 3.6;
    }
    groups.push(group);
    scene.add(group);
  });
  window.__showCar = (n) => { groups.forEach((g, i) => { g.visible = i === n; g.position.set(0, 0, 0); }); return keys[n]; };

  window.__groups = groups;   // for isolating one mesh while debugging
  window.__carsReady = true; // probe flag for verification

  addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  renderer.setAnimationLoop(() => {
    controls.update();
    renderer.render(scene, camera);
  });
</script>
</body>
</html>
